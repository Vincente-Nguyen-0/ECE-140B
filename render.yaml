services:
  - type: web
    name: ece-140b-api
    runtime: python3
    buildCommand: pip install -r ECE 140B/requirements.txt
    startCommand: uvicorn ECE 140B.server_api_fastapi:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: postgresql://eshady_db_user:eshady_db_password@eshady_db_host/eshady_db
      - key: ESHADY_SECRET_KEY
        value: eshady-secret-key-2026