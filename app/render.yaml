services:
  - type: web
    name: eshady-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server_api_fastapi:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ESHADY_SECRET_KEY
        value: change-me
      - key: GOOGLE_CLIENT_ID
        value: your-google-client-id
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://ece-140b.onrender.com/auth/google/callback
